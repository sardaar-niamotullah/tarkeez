# package name
name: tarkeez
description: "A new Flutter project."

# Display name in Android, ios, and other platfroms
# To change the app name run this command `dart run rename_app:main`
config_name:
  name: "Tarkeez"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.4
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  go_router: ^17.2.1
  bloc: ^9.2.0
  meta: ^1.17.0
  intl: ^0.20.2
  supabase_flutter: ^2.12.4
  get_it: ^9.2.1
  http: ^1.6.0
  skeletonizer: ^2.1.3
  equatable: ^2.0.8
  pdf: ^3.12.0
  flutter_soloud: ^5.0.2
  fl_chart: ^1.2.0
  bloc_concurrency: ^0.3.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  rename_app: ^1.6.6
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets: 
    - .env
    - assets/
    - assets/images/
    - assets/images/locked_backdrops/
    - assets/svgs/
    - assets/icon/
    - assets/sounds/

  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/source_sans_3/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/source_sans_3/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/source_sans_3/SourceSans3-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
