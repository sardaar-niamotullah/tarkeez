# package name
name: tarkeez
description: "A new Flutter project."

# Display name in Android, ios, and other platfroms
# To change the app name run this command `dart run rename_app:main`
config_name:
  name: "Tarkeez"

publish_to: "none" # Remove this line if you wish to publish to pub.dev

# Before every release, don't forget to update the splash logo based on the target device.
version: 1.0.0+7

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.4
  flutter_bloc: ^9.1.1
  shared_preferences: ^2.5.5
  go_router: ^17.2.1
  bloc: ^9.2.0
  meta: ^1.17.0
  intl: ^0.20.2
  supabase_flutter: ^2.12.4
  get_it: ^9.2.1
  http: ^1.6.0
  skeletonizer: ^2.1.3
  equatable: ^2.0.8
  pdf: ^3.12.0
  flutter_soloud: ^5.0.2
  fl_chart: ^1.2.0
  bloc_concurrency: ^0.3.0
  collection: ^1.19.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  flutter_native_splash: ^2.4.8
  tailwind_breakpoints: ^0.1.0
  flutter_dotenv: ^6.0.1
  google_sign_in: ^7.2.0
  connectivity_plus: ^7.3.2
  cached_network_image: ^4.0.5
  url_launcher: ^6.3.3
  flutter_foreground_task: ^11.0.3
  package_info_plus: ^10.2.2
  youtube_player_iframe: ^6.0.2
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  rename_app: ^1.6.6
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/
    - assets/svgs/
    - assets/logos/
    - assets/sounds/
    - assets/images/
    - assets/images/locked_backdrops/

  fonts:
    - family: SourceSans3
      fonts:
        - asset: assets/fonts/source_sans_3/SourceSans3-Regular.ttf
          weight: 400
        - asset: assets/fonts/source_sans_3/SourceSans3-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/source_sans_3/SourceSans3-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
    - family: ArialRounded
      fonts:
        - asset: assets/fonts/arial_rounded/ArialRoundedMT-Regular.ttf
          weight: 400
        - asset: assets/fonts/arial_rounded/ArialRoundedMT-Bold.ttf
          weight: 700

# Native splash screen shown while the app loads
# To regenerate run `dart run flutter_native_splash:create`
flutter_native_splash:
  color: "#0A0A0A"
  color_dark: "#0A0A0A"
  image: assets/logos/splash_ios.png
  android_12:
    color: "#0A0A0A"
    color_dark: "#0A0A0A"
    image: assets/logos/splash_ios.png

# App launcher icons for all platforms
# To regenerate run `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/logos/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#27D366"
  adaptive_icon_foreground: "assets/logos/logo_transparent.png"
  web:
    generate: true
    image_path: "assets/logos/logo.png"
    background_color: "#27D366"
    theme_color: "#111111"
  windows:
    generate: true
    image_path: "assets/logos/logo.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/logos/logo.png"
